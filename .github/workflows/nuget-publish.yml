name: Publish NuGet Packages

on:
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '.github/workflows/nuget-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - name: coreone.modelpatch.abstract
            path: src/CoreOne.ModelPatch.Abstract/CoreOne.ModelPatch.Abstract.csproj
          - name: coreone.modelpatch
            path: src/CoreOne.ModelPatch/CoreOne.ModelPatch.csproj
          - name: coreone.modelpatch.tenants
            path: src/CoreOne.ModelPatch.Tenants/CoreOne.ModelPatch.Tenants.csproj

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Get project version
        id: get_version
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" ${{ matrix.project.path }})
          echo "Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if package version exists on NuGet
        id: check_nuget
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          PACKAGE_NAME="${{ matrix.project.name }}"
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuget.org/v3-flatcontainer/$PACKAGE_NAME/$VERSION/$PACKAGE_NAME.$VERSION.nupkg)

          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Package version $VERSION already exists on NuGet."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package version $VERSION does NOT exist on NuGet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build project
        run: dotnet build ${{ matrix.project.path }} --configuration Release

      - name: Pack NuGet
        if: steps.check_nuget.outputs.exists == 'false'
        run: dotnet pack ${{ matrix.project.path }} --configuration Release --no-build

      - name: Publish to NuGet
        if: steps.check_nuget.outputs.exists == 'false'
        run: dotnet nuget push $(dirname ${{ matrix.project.path }})/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json


on:
  push:
    branches:
      - main
    paths:
      - '**/*.csproj'
      - '.github/workflows/nuget-publish.yml'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: |
              9.0.x
              10.0.x

      - name: Restore solution
        run: dotnet restore CoreOne.ModelPatch.sln

      - name: Build solution
        run: dotnet build CoreOne.ModelPatch.sln --configuration Release --no-restore

      # ── CoreOne.ModelPatch.Abstract ──────────────────────────────────────────

      - name: Get version - Abstract
        id: version_abstract
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/CoreOne.ModelPatch.Abstract/CoreOne.ModelPatch.Abstract.csproj)
          echo "Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check NuGet - Abstract
        id: check_abstract
        run: |
          VERSION="${{ steps.version_abstract.outputs.version }}"
          PACKAGE="coreone.modelpatch.abstract"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuget.org/v3-flatcontainer/$PACKAGE/$VERSION/$PACKAGE.$VERSION.nupkg)
          if [ "$STATUS" -eq 200 ]; then
            echo "Package version $VERSION already exists on NuGet."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package version $VERSION does NOT exist on NuGet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Pack - Abstract
        if: steps.check_abstract.outputs.exists == 'false'
        run: dotnet pack src/CoreOne.ModelPatch.Abstract/CoreOne.ModelPatch.Abstract.csproj --configuration Release --no-build

      - name: Publish - Abstract
        if: steps.check_abstract.outputs.exists == 'false'
        run: dotnet nuget push src/CoreOne.ModelPatch.Abstract/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json

      # ── CoreOne.ModelPatch ───────────────────────────────────────────────────

      - name: Get version - ModelPatch
        id: version_modelpatch
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/CoreOne.ModelPatch/CoreOne.ModelPatch.csproj)
          echo "Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check NuGet - ModelPatch
        id: check_modelpatch
        run: |
          VERSION="${{ steps.version_modelpatch.outputs.version }}"
          PACKAGE="coreone.modelpatch"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuget.org/v3-flatcontainer/$PACKAGE/$VERSION/$PACKAGE.$VERSION.nupkg)
          if [ "$STATUS" -eq 200 ]; then
            echo "Package version $VERSION already exists on NuGet."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package version $VERSION does NOT exist on NuGet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Pack - ModelPatch
        if: steps.check_modelpatch.outputs.exists == 'false'
        run: dotnet pack src/CoreOne.ModelPatch/CoreOne.ModelPatch.csproj --configuration Release --no-build

      - name: Publish - ModelPatch
        if: steps.check_modelpatch.outputs.exists == 'false'
        run: dotnet nuget push src/CoreOne.ModelPatch/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json

      # ── CoreOne.ModelPatch.Tenants ───────────────────────────────────────────

      - name: Get version - Tenants
        id: version_tenants
        run: |
          VERSION=$(grep -oPm1 "(?<=<Version>)[^<]+" src/CoreOne.ModelPatch.Tenants/CoreOne.ModelPatch.Tenants.csproj | head -1)
          echo "Package version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check NuGet - Tenants
        id: check_tenants
        run: |
          VERSION="${{ steps.version_tenants.outputs.version }}"
          PACKAGE="coreone.modelpatch.tenants"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.nuget.org/v3-flatcontainer/$PACKAGE/$VERSION/$PACKAGE.$VERSION.nupkg)
          if [ "$STATUS" -eq 200 ]; then
            echo "Package version $VERSION already exists on NuGet."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Package version $VERSION does NOT exist on NuGet."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Pack - Tenants
        if: steps.check_tenants.outputs.exists == 'false'
        run: dotnet pack src/CoreOne.ModelPatch.Tenants/CoreOne.ModelPatch.Tenants.csproj --configuration Release --no-build

      - name: Publish - Tenants
        if: steps.check_tenants.outputs.exists == 'false'
        run: dotnet nuget push src/CoreOne.ModelPatch.Tenants/bin/Release/*.nupkg --api-key ${{ secrets.NUGET_KEY }} --source https://api.nuget.org/v3/index.json

